name: Build OrangeFox Recovery - Galaxy Tab A7

on:
  workflow_dispatch:

jobs:
  build:
    name: 🦊 Build OrangeFox for SM-T505
    runs-on: ubuntu-24.04

    env:
      DEVICE: gta4l
      DEVICE_PATH: device/samsung/gta4l
      COMMON_PATH: device/samsung/gta4l-common
      KERNEL_PATH: kernel/samsung/sm6115

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses6 \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses6 \
            libncurses-dev \
            libssl-dev \
            lz4 \
            openssl \
            pngcrush \
            python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            wget \
            zip \
            zlib1g-dev

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install Repo
        run: |
          mkdir -p "$HOME/bin"
          curl https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync OrangeFox sources
        run: |
          mkdir -p "$GITHUB_WORKSPACE/orangefox"
          cd "$GITHUB_WORKSPACE/orangefox"

          git clone https://gitlab.com/OrangeFox/sync.git -b fox_12.1 sync

          cd sync
          ./orangefox_sync.sh \
            --branch fox_12.1 \
            --path "$GITHUB_WORKSPACE/orangefox"

      - name: Clone Galaxy Tab A7 device tree
        working-directory: orangefox
        run: |
          mkdir -p device/samsung

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_device_samsung_gta4l.git \
            device/samsung/gta4l

      - name: Clone Galaxy Tab A7 common tree
        working-directory: orangefox
        run: |
          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_device_samsung_gta4l-common.git \
            device/samsung/gta4l-common

      - name: Clone SM6115 kernel
        working-directory: orangefox
        run: |
          mkdir -p kernel/samsung

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_samsung_sm6115.git \
            kernel/samsung/sm6115

      - name: Configure OrangeFox
        working-directory: orangefox
        run: |
          cat > device/samsung/gta4l/vendorsetup.sh <<'EOF'
          #!/bin/bash

          export FOX_BUILD_DEVICE=gta4l

          # Samsung is not a Xiaomi/MIUI device.
          export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1

          # Enable ccache.
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          # Device is expected to use dynamic partitions.
          # Enable this only if the device tree confirms VAB.
          # export FOX_VIRTUAL_AB_DEVICE=1

          EOF

          chmod +x device/samsung/gta4l/vendorsetup.sh

      - name: Configure ccache
        run: |
          mkdir -p "$HOME/.ccache"
          ccache -M 50G
          ccache -z

      - name: Initialize build environment
        working-directory: orangefox
        run: |
          source build/envsetup.sh

      - name: Lunch OrangeFox target
        working-directory: orangefox
        run: |
          source build/envsetup.sh

          export FOX_BUILD_DEVICE=gta4l

          lunch twrp_gta4l-eng

      - name: Build OrangeFox
        working-directory: orangefox
        run: |
          source build/envsetup.sh

          export FOX_BUILD_DEVICE=gta4l
          export OF_DISABLE_MIUI_SPECIFIC_FEATURES=1

          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          mka recoveryimage 2>&1 | tee build.log

      - name: Find build output
        working-directory: orangefox
        run: |
          echo "===== Recovery output ====="

          find out/target/product/gta4l \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.img" \
              -o -name "*.zip" \
              -o -name "*.tar" \
            \) \
            -print || true

          echo "===== OrangeFox files ====="

          find out/target/product/gta4l \
            -type f \
            -iname "*orangefox*" \
            -print || true

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-gta4l
          path: |
            orangefox/out/target/product/gta4l/OrangeFox-*.img
            orangefox/out/target/product/gta4l/recovery.img
            orangefox/out/target/product/gta4l/*.zip
            orangefox/out/target/product/gta4l/*.tar
          if-no-files-found: warn

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-build-log
          path: orangefox/build.log
          if-no-files-found: warn

      - name: Show ccache statistics
        run: |
          ccache -s
